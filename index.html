<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Si PANTAU Desa - Kecamatan Ngablak</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between" x-data="appData()" x-init="initData()">

    <!-- HEADER / NAVBAR -->
    <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-700 p-2.5 rounded-xl border border-emerald-600 shadow-inner flex items-center justify-center">
                    <svg class="w-6 h-6 text-emerald-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                </div>
                <div>
                    <!-- Header Dinamis: Disederhanakan jika sudah login, lengkap jika di halaman depan -->
                    <h1 class="font-bold text-base sm:text-lg tracking-wide leading-tight" x-text="currentUser ? 'SI PANTAU DESA' : 'SI PANTAU DESA'"></h1>
                    <p class="text-xs text-emerald-200" x-text="currentUser ? 'Kecamatan Ngablak' : 'Kecamatan Ngablak — Kabupaten Magelang'"></p>
                </div>
            </div>
            <div>
                <template x-if="currentUser">
                    <div class="flex items-center space-x-2">
                        <button @click="showChangePasswordModal = true" class="bg-emerald-700 hover:bg-emerald-600 text-xs px-3 py-1.5 rounded-lg transition border border-emerald-500 font-medium">
                            Ubah Password
                        </button>
                        <button @click="logout()" class="bg-emerald-900 hover:bg-emerald-950 text-xs px-3 py-1.5 rounded-lg border border-emerald-700 transition flex items-center space-x-1 font-medium">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            <span x-text="currentUser.role === 'admin' ? 'Keluar (Admin)' : 'Keluar (' + currentUser.name + ')'"></span>
                        </button>
                    </div>
                </template>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow">

        <!-- INDIKATOR LOADING -->
        <div x-show="isLoading" class="fixed top-16 right-4 bg-emerald-600 text-white text-xs px-4 py-2 rounded-xl shadow-lg z-50 flex items-center space-x-2 animate-bounce">
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span x-text="loadingText"></span>
        </div>

        <!-- 1. HALAMAN LOGIN -->
        <template x-if="!currentUser">
            <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden mt-6">
                <div class="bg-emerald-700 px-6 py-6 text-white text-center">
                    <h2 class="text-xl font-bold">Masuk Portal Si PANTAU</h2>
                    <p class="text-xs text-emerald-100 mt-1">Sistem Pelaporan Koordinasi Mingguan 16 Desa</p>
                </div>
                <div class="p-6 space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-2">Pilih Peran Akses</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button @click="loginRole = 'user'" :class="loginRole === 'user' ? 'bg-emerald-700 text-white border-emerald-700 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'" class="py-2.5 px-4 rounded-xl border text-sm font-medium transition flex items-center justify-center space-x-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                                <span>User Desa</span>
                            </button>
                            <button @click="loginRole = 'admin'" :class="loginRole === 'admin' ? 'bg-emerald-700 text-white border-emerald-700 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'" class="py-2.5 px-4 rounded-xl border text-sm font-medium transition flex items-center justify-center space-x-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                                <span>Camat / Admin</span>
                            </button>
                        </div>
                    </div>

                    <!-- Form Input User Desa -->
                    <template x-if="loginRole === 'user'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih Desa (16 Desa Ngablak)</label>
                                <select x-model="selectedVillage" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm bg-white">
                                    <option value="">-- Pilih Nama Desa --</option>
                                    <template x-for="village in villagesList" :key="village">
                                        <option :value="village" x-text="village"></option>
                                    </template>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kata Sandi Desa</label>
                                <div class="relative">
                                    <input :type="showLoginPass ? 'text' : 'password'" x-model="villagePin" placeholder="Masukkan kata sandi (Default: 123456)" class="w-full px-3.5 py-2.5 pr-10 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                                    <button type="button" @click="showLoginPass = !showLoginPass" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                        <svg x-show="!showLoginPass" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                        <svg x-show="showLoginPass" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.046 10.046 0 013.122-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-1.415 1.414l-14-14"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- Form Input Admin Camat -->
                    <template x-if="loginRole === 'admin'">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kode Akses Admin / Camat</label>
                                <div class="relative">
                                    <input :type="showAdminPass ? 'text' : 'password'" x-model="adminCode" placeholder="Masukkan kata sandi admin (Default: camatngablak)" class="w-full px-3.5 py-2.5 pr-10 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                                    <button type="button" @click="showAdminPass = !showAdminPass" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                        <svg x-show="!showAdminPass" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                        <svg x-show="showAdminPass" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.046 10.046 0 013.122-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-1.415 1.414l-14-14"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>

                    <button @click="handleLogin()" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5 rounded-xl shadow transition text-sm">
                        Masuk Sistem
                    </button>
                </div>
            </div>
        </template>

        <!-- 2. DASHBOARD USER DESA -->
        <template x-if="currentUser && currentUser.role === 'user'">
            <div class="max-w-3xl mx-auto space-y-6">
                <!-- Header Status & Pemilihan Bulan & Minggu -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">Panel Desa</span>
                            <h2 class="text-xl font-bold text-slate-900 mt-1" x-text="'Desa ' + currentUser.name"></h2>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 uppercase">Bulan</label>
                                <select x-model="selectedMonth" class="bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-bold py-1.5 px-3 rounded-xl focus:outline-none">
                                    <option value="Januari">Januari</option>
                                    <option value="Februari">Februari</option>
                                    <option value="Maret">Maret</option>
                                    <option value="April">April</option>
                                    <option value="Mei">Mei</option>
                                    <option value="Juni">Juni</option>
                                    <option value="Juli">Juli</option>
                                    <option value="Agustus">Agustus</option>
                                    <option value="September">September</option>
                                    <option value="Oktober">Oktober</option>
                                    <option value="November">November</option>
                                    <option value="Desember">Desember</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 uppercase">Tahun</label>
                                <select x-model="selectedYear" class="bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-bold py-1.5 px-3 rounded-xl focus:outline-none">
                                    <option value="2026">2026</option>
                                    <option value="2027">2027</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-semibold text-slate-500 uppercase">Periode Minggu</label>
                                <select x-model="selectedWeek" class="bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-bold py-1.5 px-3 rounded-xl focus:outline-none">
                                    <option value="1">Minggu ke-1</option>
                                    <option value="2">Minggu ke-2</option>
                                    <option value="3">Minggu ke-3</option>
                                    <option value="4">Minggu ke-4</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-100">
                        <p class="text-xs font-semibold text-slate-600 mb-2" x-text="'Status Laporan Bulan ' + selectedMonth + ' ' + selectedYear + ':'"></p>
                        <div class="grid grid-cols-4 gap-2">
                            <template x-for="w in [1,2,3,4]" :key="w">
                                <div @click="selectedWeek = w" class="p-2.5 rounded-xl border text-center cursor-pointer transition" :class="selectedWeek == w ? 'border-emerald-600 bg-emerald-50 ring-2 ring-emerald-500/20' : 'border-slate-200 bg-slate-50 hover:bg-slate-100'">
                                    <p class="text-[10px] font-semibold text-slate-500 uppercase" x-text="'Minggu ' + w"></p>
                                    <span class="inline-block mt-1 text-[10px] px-2 py-0.5 rounded-full font-bold" :class="hasReportForPeriod(currentUser.name, selectedMonth, selectedYear, w) ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'" x-text="hasReportForPeriod(currentUser.name, selectedMonth, selectedYear, w) ? 'Sudah Ada' : 'Belum Ada'"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Form Upload Laporan Ringan Anti-Gagal -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-3 gap-2">
                        <h3 class="font-bold text-slate-800" x-text="'Input Laporan — ' + selectedMonth + ' ' + selectedYear + ' (Minggu ke-' + selectedWeek + ')'"></h3>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full" :class="getCurrentWeekReport() ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'" x-text="getCurrentWeekReport() ? 'Status: Terisi Online' : 'Status: Belum Terisi'"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Pelaksanaan Rapat Si PANTAU</label>
                        <input type="date" x-model="reportForm.exactDate" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm bg-white">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Ringkasan Notulensi Koordinasi Mingguan</label>
                        <textarea x-model="reportForm.summary" rows="4" placeholder="Tuliskan poin-poin hasil rapat koordinasi..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm"></textarea>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tautan Link Google Drive PDF Notulensi</label>
                        <input type="text" x-model="reportForm.pdfData" placeholder="Tempel tautan Google Drive PDF di sini..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tautan Link Google Drive Foto Dokumentasi</label>
                        <input type="text" x-model="reportForm.fotoData" placeholder="Tempel tautan Google Drive Foto di sini..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
                    </div>

                    <div class="flex space-x-2 pt-2">
                        <button @click="submitReport()" class="flex-grow bg-emerald-700 hover:bg-emerald-800 text-white font-medium py-2.5 rounded-xl shadow transition text-sm flex items-center justify-center space-x-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                            <span x-text="getCurrentWeekReport() ? 'Simpan Perubahan Laporan Ke Database' : 'Kirim Laporan Ke Database Online'"></span>
                        </button>
                        <template x-if="getCurrentWeekReport()">
                            <button @click="deleteWholeWeekReport()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-4 py-2.5 rounded-xl text-sm font-semibold transition">
                                Hapus
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- 3. DASHBOARD ADMIN CAMAT -->
        <template x-if="currentUser && currentUser.role === 'admin'">
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Rekapitulasi Online Si PANTAU Desa</h2>
                        <p class="text-xs text-slate-500">Data laporan & password tersambung secara real-time</p>
                    </div>
                    <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                        <button @click="initData()" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 text-xs font-bold py-2 px-3 rounded-xl border border-emerald-300 flex items-center space-x-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                            <span>Refresh Data</span>
                        </button>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-500 uppercase">Filter Bulan</label>
                            <select x-model="adminFilterMonth" class="bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-bold py-2 px-3 rounded-xl focus:outline-none">
                                <option value="Januari">Januari</option>
                                <option value="Februari">Februari</option>
                                <option value="Maret">Maret</option>
                                <option value="April">April</option>
                                <option value="Mei">Mei</option>
                                <option value="Juni">Juni</option>
                                <option value="Juli">Juli</option>
                                <option value="Agustus">Agustus</option>
                                <option value="September">September</option>
                                <option value="Oktober">Oktober</option>
                                <option value="November">November</option>
                                <option value="Desember">Desember</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[10px] font-semibold text-slate-500 uppercase">Filter Tahun</label>
                            <select x-model="adminFilterYear" class="bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-bold py-2 px-3 rounded-xl focus:outline-none">
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-3">
                        <div>
                            <h3 class="font-bold text-slate-900" x-text="'Status Kelengkapan Bulan ' + adminFilterMonth + ' ' + adminFilterYear"></h3>
                            <p class="text-xs text-slate-500">Klik kotak M1-M4 untuk memeriksa detail dokumen & foto desa</p>
                        </div>
                        <input type="text" x-model="searchQuery" placeholder="Cari nama desa..." class="px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none w-full sm:w-64">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                        <template x-for="village in filteredVillages()" :key="village">
                            <div class="border rounded-xl p-4 bg-white hover:border-emerald-300 transition shadow-sm flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <span class="font-bold text-sm text-slate-800" x-text="village"></span>
                                        <button @click="resetVillagePassword(village)" title="Reset Password ke 123456" class="text-[10px] text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-md hover:bg-amber-100 font-semibold">
                                            Reset PW
                                        </button>
                                    </div>
                                    
                                    <div class="grid grid-cols-4 gap-1 my-3">
                                        <template x-for="w in [1,2,3,4]" :key="w">
                                            <div @click="openAdminDetail(village, adminFilterMonth, adminFilterYear, w)" class="p-1.5 rounded-lg text-center cursor-pointer border transition" :class="hasReportForPeriod(village, adminFilterMonth, adminFilterYear, w) ? 'bg-emerald-100 border-emerald-300 text-emerald-800 font-bold' : 'bg-slate-50 border-slate-200 text-slate-400'">
                                                <p class="text-[9px]">M<span x-text="w"></span></p>
                                                <span class="text-[10px]" x-text="hasReportForPeriod(village, adminFilterMonth, adminFilterYear, w) ? '✓' : '—'"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                                <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                                    <span class="text-slate-500">Kelengkapan:</span>
                                    <span class="font-bold text-emerald-700" x-text="getSubmittedWeeksCountForMonth(village, adminFilterMonth, adminFilterYear) + '/4 Mgg'"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- MODAL UBAH PASSWORD USER / ADMIN -->
        <template x-if="showChangePasswordModal">
            <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-xl border border-slate-200">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h3 class="font-bold text-slate-900 text-sm">Ubah Kata Sandi Online</h3>
                        <button @click="showChangePasswordModal = false" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Kata Sandi Baru</label>
                            <div class="relative">
                                <input :type="showNewPass ? 'text' : 'password'" x-model="newPassword" placeholder="Masukkan kata sandi baru" class="w-full px-3 py-2 pr-10 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                                <button type="button" @click="showNewPass = !showNewPass" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                                    <svg x-show="!showNewPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                    <svg x-show="showNewPass" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.046 10.046 0 013.122-.863c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m-1.415 1.414l-14-14"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-2 pt-2">
                        <button @click="showChangePasswordModal = false" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs rounded-lg font-medium">Batal</button>
                        <button @click="saveNewPassword()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white text-xs rounded-lg font-medium">Simpan Password</button>
                    </div>
                </div>
            </div>
        </template>

        <!-- MODAL DETAIL UNTUK CAMAT -->
        <template x-if="adminDetailModal">
            <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto shadow-xl border border-slate-200 p-6 space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <div>
                            <span class="text-xs text-emerald-700 font-semibold uppercase" x-text="'Laporan ' + adminDetailModal.month + ' ' + adminDetailModal.year + ' — Minggu Ke-' + adminDetailModal.week"></span>
                            <h3 class="text-lg font-bold text-slate-900" x-text="'Desa ' + adminDetailModal.village"></h3>
                        </div>
                        <button @click="adminDetailModal = null" class="bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-full p-1.5 text-xs font-bold">✕</button>
                    </div>

                    <template x-if="getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week)">
                        <div class="space-y-4 text-sm">
                            <div>
                                <span class="text-xs font-semibold text-slate-500 uppercase">Tanggal Pelaksanaan Rapat:</span>
                                <p class="text-xs font-bold text-slate-800" x-text="getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).tanggal || '-'"></p>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Notulensi Rapat</label>
                                <p class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-slate-700 text-xs leading-relaxed" x-text="getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).ringkasan"></p>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Dokumen PDF Notulensi</label>
                                <template x-if="getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).pdf_url">
                                    <div class="border rounded-xl overflow-hidden bg-slate-100 mb-2"><iframe :src="getPreviewUrl(getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).pdf_url)" class="w-full h-[480px]" frameborder="0" allowfullscreen></iframe></div>
                                    <a :href="formatDriveLink(getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).pdf_url)" target="_blank" class="inline-flex items-center space-x-2 bg-emerald-700 hover:bg-emerald-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow transition">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                                        <span>Buka Dokumen PDF di Tab Baru</span>
                                    </a>
                                </template>
                                <template x-if="!getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).pdf_url">
                                    <p class="text-xs text-slate-400 italic">Tidak ada tautan PDF yang dilampirkan.</p>
                                </template>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Dokumentasi Foto Kegiatan</label>
                                <template x-if="getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).foto_url">
                                    <div class="border rounded-xl overflow-hidden bg-slate-100 mb-2"><img :src="getImageUrl(getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).foto_url)" class="w-full max-h-[420px] object-contain bg-white" loading="lazy"></div>
                                    <div class="space-y-2">
                                        <a :href="formatDriveLink(getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).foto_url)" target="_blank" class="inline-flex items-center space-x-2 bg-sky-700 hover:bg-sky-800 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow transition">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                            <span>Lihat Foto / Buka Tautan Foto</span>
                                        </a>
                                    </div>
                                </template>
                                <template x-if="!getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week).foto_url">
                                    <p class="text-xs text-slate-400 italic">Tidak ada tautan foto yang dilampirkan.</p>
                                </template>
                            </div>
                        </div>
                    </template>

                    <template x-if="!getReport(adminDetailModal.village, adminDetailModal.month, adminDetailModal.year, adminDetailModal.week)">
                        <div class="text-center py-8">
                            <p class="text-sm text-slate-500">Desa ini belum mengirimkan laporan untuk periode tersebut.</p>
                        </div>
                    </template>

                    <div class="border-t pt-4 flex justify-end">
                        <button @click="adminDetailModal = null" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-4 py-2 rounded-xl transition">Tutup Detail</button>
                    </div>
                </div>
            </div>
        </template>
    </main>

    <!-- FOOTER -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-8 text-center text-xs text-slate-500">
        <p>Si PANTAU Desa — Pemerintah Kecamatan Ngablak</p>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyoZ7Li7sLhpaBfOy-GqyOsSr65QdLSTMLH4OJb7RGilA1mZV3SHoarY7UDvsdCllSikw/exec";
        const VILLAGES = [
            "Bandungrejo", "Genikan", "Girirejo", "Jogonayan", "Jogoyasan", 
            "Kanigoro", "Keditan", "Madyogondo", "Magersari", "Ngablak", 
            "Pagergunung", "Pandean", "Selomirah", "Seloprojo", "Sumberejo", "Tejosari"
        ];

        function appData() {
            return {
                villagesList: VILLAGES,
                currentUser: null,
                loginRole: 'user',
                selectedVillage: '',
                villagePin: '',
                adminCode: '',
                searchQuery: '',
                isLoading: false,
                loadingText: 'Memuat Data...',
                
                selectedMonth: 'November',
                selectedYear: '2026',
                selectedWeek: 1,

                adminFilterMonth: 'November',
                adminFilterYear: '2026',
                adminDetailModal: null,

                showLoginPass: false,
                showAdminPass: false,
                showNewPass: false,

                showChangePasswordModal: false,
                newPassword: '',

                onlineReports: [],
                onlinePasswords: [],

                reportForm: {
                    exactDate: new Date().toISOString().split('T')[0],
                    summary: '',
                    pdfData: '',
                    fotoData: ''
                },

                initData() {
                    this.fetchAllData();
                    this.$watch('selectedMonth', () => this.loadReportForm());
                    this.$watch('selectedYear', () => this.loadReportForm());
                    this.$watch('selectedWeek', () => this.loadReportForm());
                },

                async fetchAllData() {
                    this.isLoading = true;
                    this.loadingText = 'Sinkronisasi Database Online...';
                    try {
                        const resReports = await fetch(API_URL);
                        const dataReports = await resReports.json();
                        if (Array.isArray(dataReports)) this.onlineReports = dataReports;

                        const resPass = await fetch(`${API_URL}?sheet=passwords`);
                        const dataPass = await resPass.json();
                        if (Array.isArray(dataPass)) this.onlinePasswords = dataPass;
                    } catch (error) {
                        console.error("Gagal sinkronisasi data:", error);
                    } finally {
                        this.isLoading = false;
                    }
                },

                getPassword(vName) {
                    const found = this.onlinePasswords.find(p => p.akun === vName);
                    return found ? found.password : '123456';
                },

                getAdminPassword() {
                    const found = this.onlinePasswords.find(p => p.akun === 'ADMIN');
                    return found ? found.password : 'camatngablak';
                },

                handleLogin() {
                    if (this.loginRole === 'user') {
                        if (!this.selectedVillage) {
                            alert('Silakan pilih nama desa.');
                            return;
                        }
                        const correctPin = this.getPassword(this.selectedVillage);
                        if (this.villagePin !== correctPin) {
                            alert('Kata sandi Desa salah!');
                            return;
                        }
                        this.currentUser = { role: 'user', name: this.selectedVillage };
                        this.loadReportForm();
                    } else {
                        const correctAdminPass = this.getAdminPassword();
                        if (this.adminCode !== correctAdminPass) {
                            alert('Kata sandi Admin salah!');
                            return;
                        }
                        this.currentUser = { role: 'admin', name: 'Camat Ngablak' };
                    }
                },

                logout() {
                    this.currentUser = null;
                    this.selectedVillage = '';
                    this.villagePin = '';
                    this.adminCode = '';
                },

                async saveNewPassword() {
                    if (!this.newPassword) {
                        alert('Password tidak boleh kosong.');
                        return;
                    }
                    this.isLoading = true;
                    this.loadingText = 'Menyimpan Password...';
                    const targetAkun = this.currentUser.role === 'user' ? this.currentUser.name : 'ADMIN';

                    try {
                        await fetch(`${API_URL}/akun/${encodeURIComponent(targetAkun)}?sheet=passwords`, {
                            method: 'DELETE'
                        });

                        const payload = {
                            sheet: 'passwords',
                            data: [{ akun: targetAkun, password: this.newPassword }]
                        };

                        const res = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        });

                        if (res.ok) {
                            alert('Kata sandi berhasil diperbarui secara online!');
                            this.newPassword = '';
                            this.showChangePasswordModal = false;
                            await this.fetchAllData();
                        } else {
                            alert('Gagal memperbarui password.');
                        }
                    } catch (e) {
                        alert('Terjadi kesalahan jaringan.');
                    } finally {
                        this.isLoading = false;
                    }
                },

                async resetVillagePassword(villageName) {
                    if (confirm(`Reset kata sandi Desa ${villageName} ke default (123456)?`)) {
                        this.isLoading = true;
                        this.loadingText = 'Meriset Password...';
                        try {
                            await fetch(`${API_URL}/akun/${encodeURIComponent(villageName)}?sheet=passwords`, {
                                method: 'DELETE'
                            });

                            const payload = {
                                sheet: 'passwords',
                                data: [{ akun: villageName, password: '123456' }]
                            };

                            await fetch(API_URL, {
                                method: 'POST',
                                headers: { 'Content-Type': 'text/plain' },
                                body: JSON.stringify(payload)
                            });

                            alert(`Kata sandi Desa ${villageName} berhasil direset.`);
                            await this.fetchAllData();
                        } catch (e) {
                            alert('Gagal mereset password.');
                        } finally {
                            this.isLoading = false;
                        }
                    }
                },

                loadReportForm() {
                    if (!this.currentUser || this.currentUser.role !== 'user') return;
                    const existing = this.getReport(this.currentUser.name, this.selectedMonth, this.selectedYear, this.selectedWeek);
                    if (existing) {
                        this.reportForm = {
                            exactDate: existing.tanggal || new Date().toISOString().split('T')[0],
                            summary: existing.ringkasan || '',
                            pdfData: existing.pdf_url || '',
                            fotoData: existing.foto_url || ''
                        };
                    } else {
                        this.reportForm = { exactDate: new Date().toISOString().split('T')[0], summary: '', pdfData: '', fotoData: '' };
                    }
                },

async submitReport() {
                    if (!this.reportForm.summary) { alert('Notulensi rapat wajib diisi.'); return; }
                    this.reportForm.pdfData = this.normalizeDriveLink(this.reportForm.pdfData);
                    this.reportForm.fotoData = this.normalizeDriveLink(this.reportForm.fotoData);
                    this.isLoading = true; this.loadingText = 'Mengirim Laporan ke Database...';
                    const payload = { data: [{ desa: this.currentUser.name, bulan: this.selectedMonth, tahun: String(this.selectedYear), minggu: String(this.selectedWeek), tanggal: this.reportForm.exactDate, ringkasan: this.reportForm.summary, pdf_url: this.reportForm.pdfData || '', foto_url: this.reportForm.fotoData || '' }] };
                    try {
                       try { await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ action: 'delete', desa: this.currentUser.name, bulan: this.selectedMonth, tahun: String(this.selectedYear), minggu: String(this.selectedWeek) }) }); } catch (e) { console.log('Delete lama dilewati.', e); }
                        const response = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) });
                        if (response.ok) { alert('Laporan berhasil tersimpan ke Database Online!'); await this.fetchAllData(); } else { const errText = await response.text(); alert('Gagal menyimpan. Server bilang: ' + errText); }
                    } catch (error) { alert('Terjadi kesalahan jaringan / CORS. Coba refresh dan ulangi lagi.'); } finally { this.isLoading = false; }
                },

                async deleteWholeWeekReport() {
                    if (confirm(`Hapus laporan minggu ini?`)) {
                        this.isLoading = true;
                        this.loadingText = 'Menghapus Laporan...';
                        try {
                            await fetch(`${API_URL}/desa/${encodeURIComponent(this.currentUser.name)}?bulan=${this.selectedMonth}&tahun=${this.selectedYear}&minggu=${this.selectedWeek}`, {
                                method: 'DELETE'
                            });
                            alert('Laporan berhasil dihapus.');
                            this.reportForm = { exactDate: new Date().toISOString().split('T')[0], summary: '', pdfData: '', fotoData: '' };
                            await this.fetchAllData();
                        } catch (e) {
                            alert('Gagal menghapus data.');
                        } finally {
                            this.isLoading = false;
                        }
                    }
                },

                getReport(village, month, year, week) {
                    return this.onlineReports.find(r => 
                        r.desa === village && 
                        r.bulan === month && 
                        String(r.tahun) === String(year) && 
                        String(r.minggu) === String(week)
                    ) || null;
                },

                getImageUrl(url) {
  if (!url) return '';
  let m = url.match(/\/d\/([^\/\?]+)/);
  if (!m) m = url.match(/[?&]id=([^&]+)/);
  if (!m) return url;
  return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';
},
formatDriveLink(url) {
  if (!url) return '#';
  let m = url.match(/\/d\/([^\/\?]+)/);
  if (!m) m = url.match(/[?&]id=([^&]+)/);
  if (!m) return url;
  return 'https://drive.google.com/file/d/' + m[1] + '/view';
},

                getCurrentWeekReport() {
                    return this.currentUser ? this.getReport(this.currentUser.name, this.selectedMonth, this.selectedYear, this.selectedWeek) : null;
                },

                hasReportForPeriod(village, month, year, week) {
                    return !!this.getReport(village, month, year, week);
                },

                getSubmittedWeeksCountForMonth(village, month, year) {
                    return this.onlineReports.filter(r => 
                        r.desa === village && 
                        r.bulan === month && 
                        String(r.tahun) === String(year)
                    ).length;
                },

getDriveId(url) {
                    if (!url) return null;
                    url = String(url).trim();
                    let m = url.match(/\/d\/([^\/\?&#]+)/);
                    if (m) return m[1];
                    m = url.match(/[?&]id=([^&#]+)/);
                    if (m) return m[1];
                    return null;
                },
                normalizeDriveLink(url) {
                    if (!url) return '';
                    url = String(url).trim();
                    const id = this.getDriveId(url);
                    if (id) return 'https://drive.google.com/file/d/' + id + '/view';
                    return url;
                },
                formatDriveLink(url) { return this.normalizeDriveLink(url) || '#'; },
                getPreviewUrl(url) {
                    if (!url) return '#';
                    const id = this.getDriveId(url);
                    if (!id) return String(url).trim();
                    return 'https://drive.google.com/file/d/' + id + '/preview';
                },
                getImageUrl(url) {
                    if (!url) return '#';
                    const id = this.getDriveId(url);
                    if (!id) return String(url).trim();
                    return 'https://drive.google.com/uc?export=view&id=' + id;
                },

                filteredVillages() {
                    if (!this.searchQuery) return this.villagesList;
                    return this.villagesList.filter(v => v.toLowerCase().includes(this.searchQuery.toLowerCase()));
                },

                openAdminDetail(village, month, year, week) {
                    this.adminDetailModal = { village: village, month: month, year: year, week: week };
                }
            }
        }
    </script>
